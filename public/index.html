<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초고속인터넷 주소 가용정보 통합 조회</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155; padding: 20px 0; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  h1 { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #94a3b8; }

  .search-section { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
  .search-box { display: flex; gap: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .search-box input { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px 16px; color: #f8fafc; font-size: 16px; outline: none; transition: border-color 0.2s; }
  .search-box input:focus { border-color: #3b82f6; }
  .search-box input::placeholder { color: #64748b; }
  .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled { background: #475569; cursor: not-allowed; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }

  .results-section { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
  .card:hover { border-color: #64748b; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #334155; }
  .card-title { font-size: 18px; font-weight: 700; }
  .card-title.skt { color: #f59e0b; }
  .card-title.kt { color: #ef4444; }
  .card-title.lgu { color: #a855f7; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.loading { background: #334155; color: #94a3b8; }
  .badge.available { background: #064e3b; color: #34d399; }
  .badge.unavailable { background: #7f1d1d; color: #f87171; }
  .badge.error { background: #78350f; color: #fbbf24; }

  .card-body { padding: 20px; min-height: 150px; }
  .loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 12px; color: #94a3b8; }
  .spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .product-list { list-style: none; }
  .product-item { padding: 10px 0; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
  .product-item:last-child { border-bottom: none; }
  .product-category { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #334155; color: #94a3b8; min-width: 50px; text-align: center; }
  .product-category.internet { background: #1e3a5f; color: #60a5fa; }
  .product-category.btv { background: #3b1f1f; color: #f87171; }
  .product-category.phone { background: #1f3b1f; color: #4ade80; }
  .product-name { font-size: 14px; color: #e2e8f0; }

  .empty-state { text-align: center; padding: 40px; color: #64748b; }
  .empty-state .icon { font-size: 40px; margin-bottom: 8px; }

  .error-msg { color: #f87171; font-size: 13px; padding: 12px; background: #7f1d1d20; border-radius: 8px; }

  .tips { max-width: 1200px; margin: 0 auto; padding: 0 20px 20px; }
  .tips-inner { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #94a3b8; }
  .tips-inner strong { color: #e2e8f0; }

  .timestamp { text-align: center; font-size: 12px; color: #64748b; margin-top: 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>🏠 초고속인터넷 주소 가용정보 통합 조회</h1>
    <p class="subtitle">주소를 한 번 입력하면 SKB, KT, LGU+ 서비스 가용성을 동시에 조회합니다</p>
  </div>
</div>

<div class="search-section">
  <div class="search-box">
    <input type="text" id="addressInput" placeholder="도로명 주소 또는 지번 주소 입력 (예: 서울시 강남구 테헤란로 152)" />
    <button class="btn btn-primary" id="searchBtn" onclick="startSearch()">🔍 조회하기</button>
    <button class="btn btn-secondary" onclick="clearResults()">초기화</button>
  </div>
</div>

<div class="tips">
  <div class="tips-inner">
    <strong>💡 사용 팁:</strong> 도로명 주소 또는 지번 주소를 입력하세요. 각 통신사 사이트를 자동으로 방문하여 결과를 가져옵니다. 조회에는 약 30~60초 소요됩니다.
  </div>
</div>

<div class="results-section">
  <div class="results-grid">
    <!-- SKT Card -->
    <div class="card" id="card-skt">
      <div class="card-header" onclick="goToSite('skt')" title="SKB 사이트에서 직접 확인">
        <span class="card-title skt">SK Broadband</span>
        <span class="badge loading" id="badge-skt">대기중</span>
      </div>
      <div class="card-body" id="body-skt">
        <div class="empty-state"><div class="icon">📡</div><div>주소를 입력하고 조회하세요</div></div>
      </div>
    </div>
    <!-- KT Card -->
    <div class="card" id="card-kt">
      <div class="card-header" onclick="goToSite('kt')" title="KT 사이트에서 직접 확인">
        <span class="card-title kt">KT</span>
        <span class="badge loading" id="badge-kt">대기중</span>
      </div>
      <div class="card-body" id="body-kt">
        <div class="empty-state"><div class="icon">📡</div><div>주소를 입력하고 조회하세요</div></div>
      </div>
    </div>
    <!-- LGU+ Card -->
    <div class="card" id="card-lgu">
      <div class="card-header" onclick="goToSite('lgu')" title="LGU+ 사이트에서 직접 확인">
        <span class="card-title lgu">LG U+</span>
        <span class="badge loading" id="badge-lgu">대기중</span>
      </div>
      <div class="card-body" id="body-lgu">
        <div class="empty-state"><div class="icon">📡</div><div>주소를 입력하고 조회하세요</div></div>
      </div>
    </div>
  </div>
  <div class="timestamp" id="timestamp"></div>
  <div style="margin-top:12px; text-align:center">
    <button class="btn btn-secondary" onclick="toggleHistory()">📋 조회 내역</button>
  </div>
  <div id="history-panel" class="history-panel" style="display:none">
    <div class="history-header">
      <span>조회 내역</span>
      <div>
        <button class="btn btn-secondary" onclick="loadHistory()" style="padding:4px 12px;font-size:12px" title="새로고침">🔄</button>
        <button class="btn btn-secondary" onclick="downloadCSV()" style="padding:4px 12px;font-size:12px;margin-left:4px" title="CSV 다운로드">📥</button>
        <button class="btn btn-secondary" onclick="clearHistory()" style="padding:4px 12px;font-size:12px;margin-left:4px" title="전체 삭제">🗑️</button>
      </div>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<style>
.history-panel { background:#1e293b; border:1px solid #334155; border-radius:12px; margin-top:16px; padding:16px; }
.history-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-weight:700; }
.history-item { padding:10px 0; border-bottom:1px solid #334155; }
.history-item-top { display:flex; justify-content:space-between; align-items:center; }
.history-del { background:none; border:none; color:#64748b; cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px; }
.history-del:hover { color:#f87171; background:#7f1d1d40; }
.history-item:last-child { border-bottom:none; }
.history-addr { font-weight:600; color:#f8fafc; margin-bottom:4px; }
.history-meta { display:flex; gap:12px; font-size:12px; color:#94a3b8; margin-bottom:4px; }
.history-elapsed { color:#60a5fa; }
.history-status { display:flex; gap:12px; font-size:12px; }
.hs { padding:2px 8px; border-radius:4px; }
.hs.skt { color:#f59e0b; background:#f59e0b20; }
.hs.kt { color:#ef4444; background:#ef444420; }
.hs.lgu { color:#a855f7; background:#a855f720; }
</style>

<script>
const providers = ['skt', 'kt', 'lgu'];
const providerNames = { skt: 'SKB', kt: 'KT', lgu: 'LGU+' };
const providerUrls = {
  skt: 'https://www.bworld.co.kr/myb/product/join/address/svcAveSearch.do',
  kt: 'https://help.kt.com/serviceinfo/AddrSearchList.do',
  lgu: 'https://www.lguplus.com/support/online/coverage-check'
};

function goToSite(provider) {
  const address = document.getElementById('addressInput').value.trim();
  const url = providerUrls[provider] + (address ? '?q=' + encodeURIComponent(address) : '');
  window.open(url, '_blank');
}

function setLoading() {
  providers.forEach(p => {
    document.getElementById(`badge-${p}`).className = 'badge loading';
    document.getElementById(`badge-${p}`).textContent = '조회중...';
    document.getElementById(`body-${p}`).innerHTML = `
      <div class="loading-spinner">
        <div class="spinner"></div>
        <div>${providerNames[p]} 조회 중...</div>
      </div>`;
  });
}

function setError(provider) {
  document.getElementById(`badge-${provider}`).className = 'badge unavailable';
    document.getElementById(`badge-${provider}`).textContent = '조회 실패';
  document.getElementById(`body-${provider}`).innerHTML = `
    <div class="empty-state"><div class="icon">❌</div><div>해당 주소가 조회되지 않습니다</div></div>`;
}

function setUnavailable(provider) {
  document.getElementById(`badge-${provider}`).className = 'badge unavailable';
  document.getElementById(`badge-${provider}`).textContent = '조회 실패';
  document.getElementById(`body-${provider}`).innerHTML = `
    <div class="empty-state"><div class="icon">❌</div><div>해당 주소가 조회되지 않습니다</div></div>`;
}

function setUnknown(provider, hint) {
  document.getElementById(`badge-${provider}`).className = 'badge unavailable';
  document.getElementById(`badge-${provider}`).textContent = '조회 실패';
  document.getElementById(`body-${provider}`).innerHTML = `
    <div class="empty-state"><div class="icon">❌</div><div>${hint || '해당 주소가 조회되지 않습니다'}</div></div>`;
}

function setAvailable(provider, products) {
  document.getElementById(`badge-${provider}`).className = 'badge available';
  document.getElementById(`badge-${provider}`).textContent = '서비스 가능';

  if (!products || products.length === 0) {
    document.getElementById(`body-${provider}`).innerHTML = `
      <div class="empty-state"><div class="icon">✅</div><div>서비스 가능 (상품 정보 없음)</div></div>`;
    return;
  }

  const categoryClass = { '인터넷': 'internet', 'B tv': 'btv', '전화': 'phone' };
  const html = `<ul class="product-list">` +
    products.map(prod => `
      <li class="product-item">
        <span class="product-category ${categoryClass[prod.category] || ''}">${prod.category}</span>
        <span class="product-name">${prod.name}</span>
      </li>`).join('') +
    `</ul>`;
  document.getElementById(`body-${provider}`).innerHTML = html;
}

async function checkProvider(provider, address) {
  try {
    const res = await fetch(`/api/check/${provider}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || `서버 오류: ${res.status}`);
    }
    return data.result;
  } catch (e) {
    return { status: 'error', error: e.message };
  }
}

function renderProvider(provider, result) {
  if (result.status === 'error') {
    setError(provider);
  } else if (result.status === 'unavailable') {
    setUnavailable(provider);
  } else if (result.status === 'unknown') {
    setUnknown(provider, result.hint);
  } else {
    setAvailable(provider, result.products);
  }
}

async function startSearch() {
  const address = document.getElementById('addressInput').value.trim();
  if (!address) {
    alert('주소를 입력해주세요.');
    return;
  }

  setLoading();
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('timestamp').textContent = '';

  const startTime = Date.now();

  try {
    // 각 통신사를 개별로 병렬 호출하여 완료되는 대로 결과 표시
    await Promise.all(providers.map(async (p) => {
      const result = await checkProvider(p, address);
      renderProvider(p, result);
    }));

    const elapsed = Date.now() - startTime;
    document.getElementById('timestamp').textContent = `총 소요시간: ${elapsed}ms | 완료 시각: ${new Date().toLocaleString('ko-KR')}`;
  } finally {
    document.getElementById('searchBtn').disabled = false;
  }
}

function clearResults() {
  document.getElementById('addressInput').value = '';
  providers.forEach(p => {
    document.getElementById(`badge-${p}`).className = 'badge loading';
    document.getElementById(`badge-${p}`).textContent = '대기중';
    document.getElementById(`body-${p}`).innerHTML = `<div class="empty-state"><div class="icon">📡</div><div>주소를 입력하고 조회하세요</div></div>`;
  });
  document.getElementById('timestamp').textContent = '';
}

// ===== History =====

let historyVisible = false;
const statusLabels = { available: '가능', unavailable: '불가', unknown: '알수없음', error: '오류' };

async function loadHistory() {
  const panel = document.getElementById('history-panel');
  const list = document.getElementById('history-list');
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:20px"><div class="icon">📭</div><div>조회 내역이 없습니다</div></div>';
      return;
    }
    list.innerHTML = data.map(item => {
      const r = item.results || {};
      const skt = statusLabels[r.skt?.status] || '-';
      const kt = statusLabels[r.kt?.status] || '-';
      const lgu = statusLabels[r.lgu?.status] || '-';
      const ts = new Date(item.timestamp).toLocaleString('ko-KR');
      return `<div class="history-item">
        <div class="history-item-top">
          <div class="history-addr">${item.address}</div>
          <button class="history-del" onclick="deleteHistoryItem(${item.id})" title="삭제">✕</button>
        </div>
        <div class="history-meta">
          <span>${ts}</span>
          <span class="history-elapsed">${(item.elapsed / 1000).toFixed(1)}s</span>
        </div>
        <div class="history-status">
          <span class="hs skt">SKB: ${skt}</span>
          <span class="hs kt">KT: ${kt}</span>
          <span class="hs lgu">LGU+: ${lgu}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="error-msg">내역 로딩 실패: ${e.message}</div>`;
  }
}

async function deleteHistoryItem(id) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  try {
    await fetch(`/api/history/${id}`, { method: 'DELETE' });
    loadHistory();
  } catch (e) {
    alert('삭제 실패: ' + e.message);
  }
}

function downloadCSV() {
  const a = document.createElement('a');
  a.href = '/api/history/csv';
  a.download = 'search_history.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function clearHistory() {
  if (!confirm('전체 조회 내역을 삭제하시겠습니까?')) return;
  try {
    await fetch('/api/history', { method: 'DELETE' });
    loadHistory();
  } catch (e) {
    alert('삭제 실패: ' + e.message);
  }
}

function toggleHistory() {
  const panel = document.getElementById('history-panel');
  historyVisible = !historyVisible;
  panel.style.display = historyVisible ? 'block' : 'none';
  if (historyVisible) loadHistory();
}

document.getElementById('addressInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startSearch();
});
</script>
</body>
</html>
